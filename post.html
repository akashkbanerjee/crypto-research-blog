<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleTag">Article — Akash</title>
  <meta name="description" id="descTag" content="">
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="dot"></span>
        <a href="./" class="brand-name">Akash Research</a>
        <span class="tagline">Crypto-native investment analysis</span>
      </div>
      <nav class="social">
        <a id="twitterLink" target="_blank" rel="noopener">Twitter</a>
        <a id="linkedinLink" target="_blank" rel="noopener">LinkedIn</a>
        <a id="githubLink" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </div>

  <main class="container article">
    <article class="article-card">
      <div class="article-hero" id="hero"></div>
      <h1 id="postTitle">Loading…</h1>
      <div class="meta" id="meta"></div>
      <div class="tags" id="tags"></div>
      <div class="content" id="content">
        <!-- Post body will render here -->
      </div>
      <div class="share">
        <a id="shareTwitter" class="btn">Share on X</a>
        <a id="shareLinkedIn" class="btn">Share on LinkedIn</a>
      </div>
    </article>
  </main>

  <footer class="container footer">
    <small>&copy; <span id="year"></span> Akash — All rights reserved.</small>
  </footer>

  <script src="./scripts/api.js"></script>
  <script src="./scripts/post.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</body>
</html>
