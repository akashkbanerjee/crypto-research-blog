<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Research — Akash</title>
  <meta name="description" content="Investment analysis, narratives, and liquid token research.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="dot"></span>
        <a href="./" class="brand-name">Akash Research</a>
        <span class="tagline">Crypto-native investment analysis</span>
      </div>
      <nav class="social">
  <a href="https://twitter.com/akashkbanerjee" target="_blank">Twitter</a>
  <a href="https://www.linkedin.com/in/akashkbanerjee" target="_blank">LinkedIn</a>
  <a href="https://github.com/akashkbanerjee" target="_blank">GitHub</a>
  <a href="https://t.me/thinkakash" target="_blank">Telegram</a>
</nav>
    </div>
  </div>

  <header class="container hero">
    <h1 class="gradient">Research & Investment Notes</h1>
    <p class="lede">Early Stage · Liquid Token Analysis · Narratives Deep Dive · Others</p>
  </header>

  <main class="container">
    <section class="card">
      <div class="filters-head">
        <h2>Latest</h2>
        <div class="chips" id="chips">
          <button class="chip active" data-tag="All">All</button>
          <button class="chip" data-tag="Early Stage">Early Stage</button>
          <button class="chip" data-tag="Liquid Token Analysis">Liquid Token Analysis</button>
          <button class="chip" data-tag="Narratives Deep Dive">Narratives Deep Dive</button>
          <button class="chip" data-tag="Others">Others</button>
        </div>
      </div>
      <div id="list" class="grid"></div>
      <div id="pager" class="pager">
        <button id="prevBtn" class="btn ghost" disabled>← Newer</button>
        <button id="nextBtn" class="btn ghost">Older →</button>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <small>&copy; <span id="year"></span> Akash — All rights reserved.</small>
  </footer>

  <script src="./scripts/api.js"></script>
  <script src="./scripts/list.js"></script>
</body>
</html>
